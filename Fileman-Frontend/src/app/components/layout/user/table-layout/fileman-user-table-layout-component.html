<div class="fm-table-wrap">
  <table class="fm-table">
    <thead>
      <tr>
        <!-- The header-td-sections below is generated: Do not modify manually! -->
        <th>
            Id
            <fileman-sorticon [sortField]="'id'" (sortEventHandler)="sort($event)"></fileman-sorticon>
        </th>
        <th>
            Name
            <fileman-sorticon [sortField]="'name'" (sortEventHandler)="sort($event)"></fileman-sorticon>
        </th>
        <th>
            Role
            <fileman-sorticon [sortField]="'role'" (sortEventHandler)="sort($event)"></fileman-sorticon>
        </th>
        <th>
            Tenants
            <fileman-sorticon [sortField]="'tenants'" (sortEventHandler)="sort($event)"></fileman-sorticon>
        </th>
        <th>
            Avatar
            <fileman-sorticon [sortField]="'avatar'" (sortEventHandler)="sort($event)"></fileman-sorticon>
        </th>
        <!-- The header-td-sections above is generated: Do not modify manually! -->

        <th><span class="fm-sr">Actions</span></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of viewedUsers; let i = index" [class.fm-row--menu-open]="isMenuOpen(i)">
        <!-- The row-td-sections below is generated: Do not modify manually! -->
        <td>{{user.id}}</td>
        <td class="fm-strong">{{user.name}}</td>
        <td><span class="fm-role" [ngClass]="'fm-role--' + (user.role || '').toLowerCase()">{{user.role}}</span></td>
        <td>{{formatTenants(user.tenants)}}</td>
        <!-- The row-td-sections above is generated: Do not modify manually! -->
        <td>
          <span class="fm-row__lead fm-row__lead--avatar" aria-hidden="true">
      <img *ngIf="hasAvatar(user.name)" [src]="getAvatar(user.name)" alt="">
      <span *ngIf="!hasAvatar(user.name)">{{getInitials(user.name)}}</span>
    </span>
        </td>

        <td class="fm-actions">
          <span *ngIf="!readOnly" class="fm-row__actions">
        <button type="button" class="fm-icon-btn" data-option="edit" aria-label="Edit user" title="Edit user" (click)="edit(user)">
          <fileman-icon name="edit"></fileman-icon>
        </button>
        <span class="fm-menu-anchor" filemanOutsideClickListener (clickedOutside)="closeMenu(i)" (keydown.escape)="closeMenu(i)">
          <button type="button" class="fm-icon-btn" aria-haspopup="menu" [attr.aria-expanded]="isMenuOpen(i)"
                  aria-label="More actions" title="More actions" (click)="toggleMenu(i, $event)">
            <fileman-icon name="more"></fileman-icon>
          </button>
          <div class="fm-menu fm-menu--floating" role="menu" [hidden]="!isMenuOpen(i)" [ngStyle]="menuStyle">
            <button type="button" class="fm-menu__item" role="menuitem" data-option="edit-menu" (click)="closeMenu(); edit(user)">
              <fileman-icon name="edit" [size]="18"></fileman-icon>Edit
            </button>
            <span class="fm-menu__sep" role="separator"></span>
            <button type="button" class="fm-menu__item fm-menu__item--danger" role="menuitem" data-option="delete" (click)="closeMenu(); delete(user)">
              <fileman-icon name="trash" [size]="18"></fileman-icon>Delete…
            </button>
          </div>
        </span>
      </span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
