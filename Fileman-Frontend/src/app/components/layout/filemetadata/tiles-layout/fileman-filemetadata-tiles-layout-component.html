<div class="fm-tiles">
  <article class="fm-tile" *ngFor="let file of viewedFiles; trackBy: trackFiles; let i = index">
    <div class="fm-tile__preview" [ngClass]="getPreviewTintClass(file)">
      <img *ngIf="hasImagePreview(file.name)" [src]="getImagePreview(file.name)" alt="">
      <pre class="fm-tile__snippet" *ngIf="hasTextPreview(file.name)">{{ getTextPreview(file.name) }}</pre>
      <ngx-doc-viewer class="fm-preview-doc" *ngIf="hasDocxPreview(file.name)"
                      [url]="getDocxPreview(file.name)" viewer="mammoth"></ngx-doc-viewer>
      <pdf-viewer class="fm-preview-pdf" *ngIf="hasPdfPreview(file.name)"
                  [src]="getPdfPreview(file.name)"
                  [render-text]="true" [show-all]="false" [original-size]="false"></pdf-viewer>
      <span class="fm-badge">{{getTypeBadge(file)}}</span>
    </div>
    <div class="fm-tile__body" tooltip="{{getDetailsTooltip(file)}}">
      <span class="fm-tile__name" [title]="file.name">{{file.name}}</span>
      <span class="fm-tile__meta">{{getMetaLine(file)}}</span>
    </div>
    <div class="fm-tile__actions">
      <button type="button" class="fm-icon-btn fm-star" data-option="change-favourite"
            [attr.aria-pressed]="isFileFavourite(file.name)"
            [attr.aria-label]="getFavouriteTooltip(file)" [title]="getFavouriteTooltip(file)"
            (click)="changeFavouriteSetting(file)">
      <fileman-icon [name]="getFavouriteIcon(file)" [size]="18"></fileman-icon>
    </button>
      <span class="fm-spacer"></span>
      <button type="button" class="fm-icon-btn" data-option="download" aria-label="Download" title="Download" (click)="download(file)">
        <fileman-icon name="download"></fileman-icon>
      </button>
      <button *ngIf="!readOnly" type="button" class="fm-icon-btn" data-option="edit" aria-label="Edit" title="Edit" (click)="edit(file)">
        <fileman-icon name="edit"></fileman-icon>
      </button>
      <span class="fm-menu-anchor" filemanOutsideClickListener (clickedOutside)="closeMenu(i)" (keydown.escape)="closeMenu(i)">
        <button type="button" class="fm-icon-btn" aria-haspopup="menu" [attr.aria-expanded]="isMenuOpen(i)"
                aria-label="More actions" title="More actions" (click)="toggleMenu(i, $event)">
          <fileman-icon name="more"></fileman-icon>
        </button>
        <div class="fm-menu fm-menu--floating" role="menu" [hidden]="!isMenuOpen(i)" [ngStyle]="menuStyle">
          <button type="button" class="fm-menu__item" role="menuitem" data-option="show-history" (click)="closeMenu(); showHistory(file)">
            <fileman-icon name="layers" [size]="18"></fileman-icon>Show history
          </button>
          <span *ngIf="!readOnly" class="fm-menu__sep" role="separator"></span>
          <button *ngIf="!readOnly" type="button" class="fm-menu__item fm-menu__item--danger" role="menuitem" data-option="delete" (click)="closeMenu(); delete(file)">
            <fileman-icon name="trash" [size]="18"></fileman-icon>Delete…
          </button>
        </div>
      </span>
    </div>
  </article>
</div>
