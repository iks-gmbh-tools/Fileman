<div class="fm-overview">

  <section class="fm-empty" *ngIf="allUsersMap.size == 0">
    <span class="fm-empty__icon"><fileman-icon name="user" [size]="26"></fileman-icon></span>
    <h2>No users yet</h2>
    <p>Use “New user” above to add the first one.</p>
  </section>

  <section class="fm-empty" *ngIf="viewedUsers.length == 0 && allUsersMap.size > 0">
    <span class="fm-empty__icon"><fileman-icon name="search" [size]="26"></fileman-icon></span>
    <h2>No users match “{{searchString}}”</h2>
    <p>Check the spelling, or clear the search.</p>
    <div class="fm-empty__actions">
      <button type="button" class="fm-btn" (click)="clearSearch()">Clear search</button>
    </div>
  </section>

  <div *ngIf="viewedUsers.length > 0" [ngSwitch]="userPreferences.layoutType">
    <fileman-user-list-layout *ngSwitchCase="layoutTypeList"
      [viewedUsers]="viewedUsers"
      [readOnly]="readOnly"
      (userEdited)="edit($event)"
      (userDeleted)="delete($event)">
    </fileman-user-list-layout>
    <fileman-user-table-layout *ngSwitchCase="layoutTypeTable"
      [viewedUsers]="viewedUsers"
      [readOnly]="readOnly"
      (userEdited)="edit($event)"
      (userDeleted)="delete($event)">
    </fileman-user-table-layout>
    <fileman-user-tiles-layout *ngSwitchCase="layoutTypeTiles"
      [viewedUsers]="viewedUsers"
      [readOnly]="readOnly"
      (userEdited)="edit($event)"
      (userDeleted)="delete($event)">
    </fileman-user-tiles-layout>
  </div>
</div>
