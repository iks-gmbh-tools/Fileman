<div class="fm-page">
  <fileman-toolbar [showPageToolbar]="false"></fileman-toolbar>

  <main class="fm-form-page fm-form-page--narrow">
    <nav class="fm-crumbs" aria-label="Breadcrumb">
      <a href="" (click)="$event.preventDefault(); cancel()">File groups</a>
      <span aria-hidden="true">›</span>
      {{newMode ? 'New file group' : toEdit?.name}}
    </nav>
    <h1 class="fm-title">{{newMode ? 'New file group' : 'Edit file group'}}</h1>

    <form class="fm-form-card" [formGroup]="form" (ngSubmit)="save()">
      <div class="fm-form-card__body" formGroupName="inputFieldControl">

        <div class="fm-alert" role="alert"
             *ngIf="(detailsForm.errors && detailsForm.touched)
                 || (nameC.errors && nameC.touched)">
          <fileman-icon name="alert"></fileman-icon>
          <div class="fm-errors">

            <!-- The error sections below are generated: Do not modify manually! -->
            <div *ngIf="nameC.errors?.required && nameC.touched">
               Name is required.
            </div>
            <div *ngIf="nameC.errors?.minlength && nameC.touched">
               Name needs at least {{nameC.errors.minlength.requiredLength}} characters.
            </div>
            <div *ngIf="nameC.errors?.isNotUnique">
               Name “{{nameC.value}}” already exists. Choose another one.
            </div>
            <!-- The error sections above are generated: Do not modify manually! -->

          </div>
        </div>

        <!-- The table section below is generated: Do not modify manually! -->
        <div class="fm-form-grid" formGroupName="detailsForm">
            <div class="fm-field">
                <label class="fm-label" for="name">Name</label>
                <input id="name" type="text" class="fm-input" formControlName="nameControl"/>
            </div>
            <div class="fm-field">
                <label class="fm-label" for="files">Files</label>
                <ng-multiselect-dropdown
                  id="files"
                  formControlName="filesControl"
                  [placeholder]="'Choose…'"
                  [data]="files"
                  (onSelect)="filesC.markAsTouched()"
                  (onSelectAll)="filesC.markAsTouched()"
                  (onDeSelect)="filesC.markAsTouched()"
                  (onDeSelectAll)="filesC.markAsTouched()"
                  [settings]="filesMultiselectDropdownSettings">
                </ng-multiselect-dropdown>
            </div>
        </div>
        <!-- The table section above is generated: Do not modify manually! -->

      </div>

      <div class="fm-form-card__actions">
        <button type="button" class="fm-btn" (click)="cancel()">Cancel</button>
        <button *ngIf="!readOnly" type="submit" class="fm-btn fm-btn--primary"
                [disabled]="(! detailsForm.touched || detailsForm.invalid)
                    && (! nameC.touched && nameC.invalid)"
                [title]="getToolTip()">{{newMode ? 'Create file group' : 'Save changes'}}</button>
      </div>
    </form>
  </main>
</div>
