<header class="fm-header">
  <fileman-logo></fileman-logo>

  <nav class="fm-tabs" aria-label="Content" *ngIf="isAdmin">
    <a *ngFor="let tab of contentTabs" class="fm-tab" href=""
       [attr.aria-current]="userPreferences.contentType === tab.type ? 'page' : null"
       (click)="$event.preventDefault(); onContentTypeChange(tab.type)">{{tab.label}}</a>
  </nav>

  <span class="fm-spacer"></span>

  <label class="fm-search" *ngIf="showPageToolbar">
    <fileman-icon name="search" [size]="18"></fileman-icon>
    <span class="fm-sr">Search {{getContentLabel()}}</span>
    <input #searchString type="search"
           [ngModel]="getSearchString()"
           (keyup)="startSearch(searchString.value)"
           (search)="startSearch(searchString.value)"
           placeholder="Search {{getContentLabel()}}">
  </label>

  <div class="fm-user">
    <button *ngIf="isAdmin" type="button" class="fm-icon-btn" id="toolbar-database"
            aria-label="Open database console" title="Open database console" (click)="openDbLink()">
      <fileman-icon [name]="iconDatabase"></fileman-icon>
    </button>
    <span class="fm-avatar" aria-hidden="true">{{getUserInitials()}}</span>
    <span>{{currentUserName}}</span>
    <button type="button" class="fm-icon-btn" id="toolbar-logout" aria-label="Log out" title="Log out" (click)="onLogout()">
      <fileman-icon [name]="iconLogout"></fileman-icon>
    </button>
  </div>
</header>

<div class="fm-main fm-main--head" *ngIf="showPageToolbar">
  <div class="fm-toolbar">
    <h1 class="fm-title">{{getTitle()}}</h1>
    <span class="fm-spacer"></span>

    <label class="fm-check" *ngIf="showFavouriteIcon">
      <input type="checkbox" id="toolbar-favourite-filter"
             [checked]="userPreferences.favouriteFilterActive"
             (change)="onFavouriteFilterClick()">
      Favourites only
    </label>

    <button type="button" class="fm-icon-btn" id="toolbar-reload"
            aria-label="Reload from server" title="Reload from server" (click)="onReloadClick()">
      <fileman-icon [name]="iconReload"></fileman-icon>
    </button>

    <div class="fm-seg" role="group" aria-label="Layout">
      <button type="button" id="toolbar-layout-list" [attr.aria-pressed]="userPreferences.layoutType === layoutTypeList"
              (click)="onLayoutClick(layoutTypeList)">List</button>
      <button type="button" id="toolbar-layout-table" [attr.aria-pressed]="userPreferences.layoutType === layoutTypeTable"
              (click)="onLayoutClick(layoutTypeTable)">Table</button>
      <button type="button" id="toolbar-layout-tiles" [attr.aria-pressed]="userPreferences.layoutType === layoutTypeTiles"
              (click)="onLayoutClick(layoutTypeTiles)">Tiles</button>
    </div>

    <button *ngIf="!readOnly" type="button" class="fm-btn fm-btn--primary" id="toolbar-new" (click)="onNewClick()">
      <fileman-icon [name]="iconNew" [size]="18"></fileman-icon>{{getNewLabel()}}
    </button>
  </div>
</div>
